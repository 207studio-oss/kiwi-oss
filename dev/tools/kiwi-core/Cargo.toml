[package]
name = "kiwi-core"
version = "0.2.0"
edition = "2021"
publish = false
description = "Kiwi v2 core: intent ledger, rule compiler, context_for bundles, writer transaction"

[[bin]]
name = "kiwi"
path = "src/main.rs"

[dependencies]
regex = "1"
rusqlite = { version = "0.40", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
toml = "0.8"
